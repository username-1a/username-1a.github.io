class pn{
constructor(x=0,y=0,t=0){this.x=t?x*cos(y):x;this.y=t?x*sin(y):y;}
add(x){return new pn(this.x+x.x,this.y+x.y)}
subt(x){return new pn(this.x-x.x,this.y-x.y)}
mult(x){return new pn(this.x*x,this.y*x)}
div(x){return new pn(this.x/x,this.y/x)}
rot(c,t){let x=this.x-c.x,y=this.y-c.y;return t?new pn(x*cos(t)-y*sin(t),x*sin(t)+y*cos(t)).add(c):this}
dist(x){return Math.sqrt((this.x-x.x)**2+(this.y-x.y)**2)}
eq(x){return this.x==x.x&&this.y==x.y}
dot(x){return this.x*x.x+this.y*x.y}
dot2(){return this.dot(this)}
det(x){return this.x*x.y-this.y*x.x}
clone(){return new pn(this.x,this.y)} //in case modifying Bs fxcks up Bd.............
dir(x){return Math.atan2(x.y-this.y,x.x-this.x)}
norm(x=1){if(this.x==0&&this.y==0)return new pn(1,0);let y=x/this.dist({x:0,y:0});return this.mult(y)}
cmult(x){return new pn(this.x*x.x-this.y*x.y,this.x*x.y+this.y*x.x)}
cdiv(x){return new pn(this.x*x.x+this.y*x.y,this.y*x.x-this.x*x.y).div(x.dot(x))}
rotTo(c,x){let y=this.subt(c);return y.cmult(x.subt(c).cdiv(y).norm()).add(c)}
mix(x,t){return this.mult(1-t).add(x.mult(t))}
tr(x,t){return this.eq(x)?this:this.mix(x,t/this.dist(x))}//translate
print(){return `(${this.x.toFixed(3)},${this.y.toFixed(3)})`}
